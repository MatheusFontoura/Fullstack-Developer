# Kamal 2 deployment.
#
# Fill in the three placeholders below (registry, image owner, server IP and host)
# and `bin/kamal setup` is the whole deploy. Nothing else in this file is a stub.

service: umanni
image: your-registry-user/umanni

servers:
  web:
    - 192.0.2.1

# Zero-downtime deploys and automatic Let's Encrypt certificates through kamal-proxy.
# assume_ssl and force_ssl are already on in config/environments/production.rb, which
# is what makes terminating TLS here safe.
proxy:
  ssl: true
  host: umanni.example.com
  # Thruster listens on 80 inside the container and serves compressed, cached assets.
  app_port: 80

registry:
  server: ghcr.io
  username: your-registry-user
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # The Solid Queue supervisor runs inside Puma rather than as a separate job role,
    # and that is a consequence of the database choice rather than a shortcut: SQLite
    # is a file, not a server, so a worker on a second machine could not reach it.
    #
    # Splitting jobs onto their own host is the moment this application would move to
    # PostgreSQL. Splitting them into a second container on the *same* host would work
    # today — both would share the storage volume — but buys little at this size.
    SOLID_QUEUE_IN_PUMA: true
    JOB_CONCURRENCY: 2
    WEB_CONCURRENCY: 2

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# The four SQLite databases and Active Storage's uploads all live here. This is the
# only stateful thing on the server, so it is the only thing that needs backing up —
# point it at a mounted volume that is backed up off the machine.
volumes:
  - "umanni_storage:/rails/storage"

# Keeps fingerprinted assets from the previous version around during a deploy, so a
# request already in flight does not 404 on a stylesheet.
asset_path: /rails/public/assets

builder:
  arch: amd64
